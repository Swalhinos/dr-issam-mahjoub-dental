name: Extract base site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and commit
        run: |
          set -e
          test -f al-qods-nextjs-site.zip || exit 0
          rm -rf /tmp/extracted
          mkdir -p /tmp/extracted
          unzip -o al-qods-nextjs-site.zip -d /tmp/extracted
          SRC=/tmp/extracted
          COUNT=$(find "$SRC" -mindepth 1 -maxdepth 1 | wc -l)
          FIRST=$(find "$SRC" -mindepth 1 -maxdepth 1 | head -n 1)
          if [ "$COUNT" = "1" ] && [ -d "$FIRST" ]; then SRC="$FIRST"; fi
          cp -a "$SRC"/. .
          rm -f al-qods-nextjs-site.zip
          git restore .github/workflows/extract.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract base Next.js site" || exit 0
          git push
